ent);\" onmouseout=\"this.src=MF+'Button_Button10.png';\" />";}B+=S2.replace("{id}","C3L0S3");B+="<table id=\"C3L0S2\"><tr><td class=\"V10\">Bungō Stray Dogs (文豪ストレイドッグス Bungō Sutorei Doggusu?, lit. Perros callejeros literarios) es una serie de manga escrita por Kafka Asagiri e ilustrada por Sango Harukawa. Ha sido serializada en la revista Young Ace de la editorial Kadokawa Shōten desde 2012, contando hasta la fecha cuenta con veintiocho volúmenes publicados. Una adaptación a serie de anime comenzó a transmitirse el 7 de abril de 2016, siendo producida por el estudio de animación Bones y dirigida por Takuya Igarashi. El anime ha sido dividido en dos partes y se anunció la transmisión de su segunda temporada el 6 de octubre de 2016. La segunda temporada finalizó el 22 de diciembre de 2016 con veinticuatro episodios. En agosto de 2017, fue lanzado un OVA titulado Bungō Stray Dogs: Hitori Ayumu, junto con el volumen número trece del manga.<br /><br />Una película animada titulada Bungō Stray Dogs: Dead Apple, fue anunciada en la página web oficial el 19 de febrero de 2017.[4] Dicha película fue estrenada el 3 de marzo de 2018. Una tercera temporada fue emitida entre el 12 de abril y el 28 de junio de 2019. Una cuarta temporada fue emitida entre el 5 de enero y el 29 de marzo de 2023. Una quinta temporada se estrenó en julio de 2023. Atsushi Nakajima es un adolescente que fue expulsado de su orfanato y en consecuencia, se ve obligado a vivir en las calles. Mientras se encuentra de pie junto a un río en el borde de la hambruna, rescata a un hombre que intentaba suicidarse en el mismo. Ese hombre resulta ser Osamu Dazai, quien junto a su compañero, Doppo Kunikida, forman parte de una agencia de detectives especial; una agencia de detectives cuyos miembros poseen diversos poderes sobrenaturales y hacen frente a los casos que son muy peligrosos o difíciles para la policía o el ejército. Atsushi, además, se entera de que los dos hombres están tras la pista de un tigre que ha aparecido en la zona recientemente, al mismo tiempo que él llegó a la ciudad. El tigre parece tener una conexión con Atsushi y mientras el caso se resuelva, está claro que el futuro de Atsushi implicará mucho más de Dazai y el resto de los detectives.</td></tr></table>";if(IE>-1&&IE<9){B+="<v:image id=\"C3L0S1\" class=\"V2\" "+MouseDown+"=\"if(!C3L0S1Toggle){this.src=MF+'pngtree-glossy-media-buttons-eject-sound-forward-vector-png-image_2716639_cropped.png';}\" "+MouseUp+"=\"if(!C3L0S1Toggle){C3L0S1Toggle=true;F12();return F70(event);}else{C3L0S1Toggle=false;this.src=MF+'pngtree-glossy-media-buttons-eject-sound-forward-vector-png-image_2716639_cropped (1).png';F13();return F70(event);}\" onmouseout=\"if(!C3L0S1Toggle){this.src=MF+'pngtree-glossy-media-buttons-eject-sound-forward-vector-png-image_2716639_cropped (1).png';if(V29){F13();return F70(event);}else{}}\" ></v:image>";}else{B+="<img id=\"C3L0S1\" class=\"V2\" "+MouseDown+"=\"if(!C3L0S1Toggle){this.src=MF+'pngtree-glossy-media-buttons-eject-sound-forward-vector-png-image_2716639_cropped.png';}return F70(event);\" "+MouseUp+"=\"if(!C3L0S1Toggle){C3L0S1Toggle=true;F12();return F70(event);}else{C3L0S1Toggle=false;this.src=MF+'pngtree-glossy-media-buttons-eject-sound-forward-vector-png-image_2716639_cropped (1).png';F13();return F70(event);}\" onmouseout=\"if(!C3L0S1Toggle){this.src=MF+'pngtree-glossy-media-buttons-eject-sound-forward-vector-png-image_2716639_cropped (1).png';if(V29){F13();return F70(event);}else{}}\" />";}B+="<div id=\"C3L0S0\" onselectstart=\"return false;\" ondragstart=\"return false;\" class=\"V3\"  onmousedown=\"var Details=window['C3L0S0Details'];Details.Grabbed=true;F91(this,Details,event,F93);\" ontouchstart=\"var Details=window['C3L0S0Details'];Details.Grabbed=true;F92(this,Details,event,F93);\" onmousemove=\"var Details=window['C3L0S0Details'];if(Details.Grabbed){F91(this,Details,event,F93);}\" ontouchmove=\"var Details=window['C3L0S0Details'];if(Details.Grabbed){F92(this,Details,event,
